name: Update dashboard data
on:
  schedule:
    - cron: "0 22 * * 1-5"   # UTC 22:00 = 한국시간 다음날 07:00 (미국장 마감 후)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "chore: update dashboard data" && git push)
